id: groundedness
name: Grounded
description: Is every claim in the answer supported by what the agent looked up (context, tool results, search results)? The judge splits the answer into claims and checks each one against those sources, quoting the sentence it used.
area: Agent behaviour
method: llm_judge
check: claims_supported
threshold: 1.0   # every claim must be backed. Lower it for agents where small slips are acceptable
settings:
  judge_model: qwen3:8b
